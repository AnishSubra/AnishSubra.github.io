publications:
  - title: "Determining the Probability of Diabetes through Machine Learning Models"
    publisher: "Curieux Academic Review"
    release_date: "2026-03-01"
    website: "https://www.curieuxreview.com/_files/ugd/60ed3c_568b41b466dc44cead5239d74e979263.pdf"
    summary: "Compared logistic regression, random forest, and neural network models on roughly 253,680 patient records with 21 health features. The neural network performed best, with an AUROC of 0.833 and accuracy of 0.860, and general health emerged as the most influential predictor. Published in the March 2026 issue (Issue 5, Part 2, p. 318)."

