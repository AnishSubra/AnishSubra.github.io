publications:
  - title: "Determining the Probability of Diabetes through Machine Learning Models"
    publisher: "Curieux Academic Review"
    release_date: "2026-03-01"
    website: "https://www.curieuxreview.com/_files/ugd/60ed3c_568b41b466dc44cead5239d74e979263.pdf"
    summary: "Compared logistic regression, random forest, and neural network models for predicting diabetes from roughly 253,000 patient records. The neural network achieved the highest AUROC (0.833) and AUPRC (0.432) and led in 5-fold cross-validation; all three models reached similar accuracy of about 0.86, a less informative measure on this imbalanced dataset. To interpret the models, compared random forest feature importance scores with SHAP values from the neural network: the random forest ranked BMI first, while the neural network ranked general health first, followed by BMI and age. Sole author; peer reviewed by Daniel Plymire, PhD, Research Scientist and Grant Writer, University of Texas at Arlington."

